    <!-- Schema.org JSON-LD Structured Data: ProfessionalService & Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "ProLanding",
      "image": "https://prolanding.agency/images/og-hero.jpg",
      "url": "https://prolanding.agency",
      "telephone": "+1-415-555-0199",
      "priceRange": "$$",

        "@type": "PostalAddress",
        "addressLocality": "San Francisco",
        "addressRegion": "CA",
        "addressCountry": "US"
      },
      "founder": {
        "@type": "Person",
        "name": "VibeCodeTo100K"
      },
      "sameAs": [
        "https://youtube.com/@VibeCodeTo100K",
        "https://github.com",
        "https://twitter.com"
      ]
    }
    </script>

    <!-- Schema.org JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the process work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We follow a proven 4-step framework: Discovery (identifying goals), Planning (wireframes & architecture), Design (UI/UX in Figma), and Development & Launch (clean React/TypeScript code)."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a website take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A standard single-page landing page typically takes 2 to 3 weeks. A comprehensive multi-section agency website or custom web app takes approximately 4 to 6 weeks from kickoff to final deployment."
          }
        },
        {
          "@type": "Question",
          "name": "Is the website mobile-friendly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, 100%. Every layout is designed mobile-first and tested rigorously across iOS, Android, tablets, and wide desktop screens."
          }
        },
        {
          "@type": "Question",
          "name": "Can I request revisions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each phase includes dedicated feedback cycles during both the design prototype stage and the development stage to ensure the final product exceeds your expectations."
          }
        },
        {
          "@type": "Question",
          "name": "Do you provide maintenance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every project includes complimentary post-launch monitoring and bug-fix support. We also offer monthly retainer packages for teams requiring ongoing feature development."
          }
        },
        {
          "@type": "Question",
          "name": "How can I start a project?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Simply scroll down to our contact section or click any Start a Project / Get Started button. Fill out your details, and our senior engineer will reply with an initial technical assessment within 24 hours."
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#080D1A] text-white antialiased font-sans selection:bg-[#3B82F6] selection:text-white">
    <div id="root"></div>

  </body>
</html>
